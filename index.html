<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muse Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #f4f1ea;
      color: #2c2a26;
      font-family: "Segoe UI", "PingFang HK", "Noto Sans CJK TC", sans-serif;
      padding: 2rem 1.25rem;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 0.5rem;
    }

    .lead {
      margin: 0 0 1.5rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e6e1d8;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(44, 42, 38, 0.08);
      padding: 1.5rem 1.75rem;
      max-width: 28rem;
      width: 100%;
    }

    .card h2 {
      margin: 0 0 0.75rem;
    }

    .card p {
      margin: 0.45rem 0;
      line-height: 1.6;
    }

    .date {
      color: #6b6560;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <h1>Muse Test</h1>
  <p class="lead">呢個係 Muse Test 的公開測試頁面。</p>
  <section class="card">
    <h2>第二次試驗</h2>
    <p class="date">2026-11-17</p>
    <p>呢個係 Vincent 第一次行 Cursor cloud agent 開 PR 嘅試驗。</p>
  </section>
</body>
</html>
